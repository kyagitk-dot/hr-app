name: Morning Brief

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 JST
  workflow_dispatch: # 手動実行も可能

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Call morning-brief endpoint
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          curl -sS -f -X POST "https://hr-app-xy1n.vercel.app/api/morning-brief" \
            -H "x-brief-token: ${LINE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json"
