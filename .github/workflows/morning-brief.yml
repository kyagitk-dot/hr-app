name: Assistant Scheduler

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分（本人設定の時刻に合わせて配信）
  workflow_dispatch: # 手動実行も可能

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          curl -sS -f -X POST "https://hr-app-xy1n.vercel.app/api/morning-brief" \
            -H "x-brief-token: ${LINE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json"
