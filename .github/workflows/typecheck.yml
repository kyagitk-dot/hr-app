name: Type check

# コードを保存（コミット）するたびに、構文エラー（書き間違い）がないか自動で検査する。
# 以前からある型の指摘（TS2xxx）では失敗させない。失敗するのは構文エラー（TS1xxx）だけ。
# 構文エラーがあるとLINEの処理が丸ごと動かなくなるため、これだけは必ず止める。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          npx tsc --noEmit --target ES2020 --lib ES2020,DOM --module ESNext --moduleResolution Bundler --jsx react-jsx --esModuleInterop --allowSyntheticDefaultImports --skipLibCheck --resolveJsonModule --isolatedModules api/*.ts lib/*.ts src/*.ts src/*.tsx > tsc-out.txt || true
          echo "---- tsc の出力（参考。型の指摘は以前からあるもので、失敗の対象ではありません） ----"
          cat tsc-out.txt
          echo "---- ここまで ----"
          if grep -E "error TS1[0-9]{3}:" tsc-out.txt; then
            echo "::error::構文エラーが見つかりました。上の行（ファイル名と行番号）を確認してください。"
            exit 1
          fi
          echo "構文エラーはありません"
