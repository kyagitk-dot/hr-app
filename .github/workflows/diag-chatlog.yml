name: Diag Chat Log

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'always 何分前から見るか'
        default: '180'
      name_filter:
        description: '名前で絞り込む（空欄で全員）'
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Dump recent chat logs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          MINUTES: ${{ github.event.inputs.minutes }}
          NAME_FILTER: ${{ github.event.inputs.name_filter }}
        run: |
          node << 'EOF'
          const https = require('https');
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_KEY);
          const projectId = sa.project_id;
          const minutes = parseInt(process.env.MINUTES || '180', 10);
          const nameFilter = (process.env.NAME_FILTER || '').trim();
          function token() {
            const now = Math.floor(Date.now() / 1000);
            const h = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
            const p = Buffer.from(JSON.stringify({iss: sa.client_email, scope: 'https://www.googleapis.com/auth/datastore', aud: 'https://oauth2.googleapis.com/token', exp: now + 3600, iat: now})).toString('base64url');
            const s = crypto.createSign('RSA-SHA256'); s.update(`${h}.${p}`);
            const jwt = `${h}.${p}.${s.sign(sa.private_key, 'base64url')}`;
            return new Promise((res, rej) => {
              const data = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`;
              const r = https.request({hostname:'oauth2.googleapis.com', path:'/token', method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded','Content-Length':data.length}}, x => { let b=''; x.on('data', d => b += d); x.on('end', () => res(JSON.parse(b).access_token)); });
              r.on('error', rej); r.write(data); r.end();
            });
          }
          function post(t, path, body) {
            return new Promise((res, rej) => {
              const data = JSON.stringify(body);
              const r = https.request({hostname:'firestore.googleapis.com', path, method:'POST', headers:{Authorization:`Bearer ${t}`, 'Content-Type':'application/json', 'Content-Length': Buffer.byteLength(data)}}, x => { let b=''; x.on('data', d => b += d); x.on('end', () => res(JSON.parse(b))); });
              r.on('error', rej); r.write(data); r.end();
            });
          }
          const v = (f) => f ? (f.stringValue ?? f.integerValue ?? f.doubleValue ?? f.booleanValue ?? f.nullValue ?? f.timestampValue ?? (f.mapValue ? JSON.stringify(Object.fromEntries(Object.entries(f.mapValue.fields||{}).map(([k,vv])=>[k,v(vv)]))) : '')) : '';
          (async () => {
            const t = await token();
            const base = `/v1/projects/${projectId}/databases/(default)/documents`;
            const since = new Date(Date.now() - minutes*60000).toISOString();
            const query = {
              structuredQuery: {
                from: [{ collectionId: 'chat_logs' }],
                where: { fieldFilter: { field: { fieldPath: 'createdAt' }, op: 'GREATER_THAN_OR_EQUAL', value: { timestampValue: since } } },
                orderBy: [{ field: { fieldPath: 'createdAt' }, direction: 'ASCENDING' }],
                limit: 200,
              },
            };
            const rows = await post(t, `${base}:runQuery`, query);
            console.log(`=== 直近${minutes}分（${nameFilter || '全員'}） ===`);
            for (const row of (rows || [])) {
              const doc = row.document;
              if (!doc) continue;
              const f = doc.fields || {};
              const name = v(f.userName);
              if (nameFilter && !String(name).includes(nameFilter)) continue;
              const ts = v(f.createdAt);
              const jst = ts ? new Date(ts).toLocaleString('ja-JP', {timeZone:'Asia/Tokyo'}) : '';
              console.log(`[${jst}] ${name} | intent=${v(f.intent)}`);
              console.log(`  送信: ${v(f.text)}`);
              console.log(`  返信: ${v(f.reply)}`);
              if (f.meta) console.log(`  meta: ${v(f.meta)}`);
            }
            console.log(`件数: ${(rows||[]).filter(r=>r.document).length}`);
          })();
          EOF
